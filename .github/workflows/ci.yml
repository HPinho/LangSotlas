name: Sotlas CI & Toolchain Build Farm

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Builds noturnos diários às 02:00 UTC
    - cron: '0 2 * * *'

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run Sotlas test suite (100% PASS)
      run: |
        python -m unittest discover -s tests -p "test_*.py"

    - name: Verify CLI tools & Subcommands
      run: |
        sotlas version
        sotlas check examples/01_hello_systems/main.sotlas
        sotlas check examples/02_safe_structures/main.sotlas
        sotlas check examples/03_systems_and_intrinsics/main.sotlas
        sotlas check examples/04_raw_memory_and_unsafe/main.sotlas
        sotlas dump-ast examples/01_hello_systems/main.sotlas
        sotlas dump-sir examples/01_hello_systems/main.sotlas
        sotlas dump-llvm examples/01_hello_systems/main.sotlas --debug
        sotlas fmt examples/01_hello_systems/main.sotlas --check
        sotlas lint examples/01_hello_systems/main.sotlas
        sotlas doc examples/01_hello_systems/main.sotlas -o examples/01_hello_systems/DOCS.md

  kernel-smoke-test:
    name: BakenOS Kernel Integration Smoke Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install -e .

    - name: Run Kernel Contract & Resolver Tests
      run: |
        python -m unittest tests.test_sotlas_kernel_language_contract
        python -m unittest tests.test_sotlas_resolver

  package-toolchain-snapshot:
    name: Package Nightly Toolchain Snapshot
    runs-on: ubuntu-latest
    needs: [test, kernel-smoke-test]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Prepare Toolchain Bundle
      run: |
        mkdir -p dist/sotlas-toolchain
        cp -r compiler tools stdlib runtime include editors examples dist/sotlas-toolchain/
        cp README.md LICENSE pyproject.toml setup.py dist/sotlas-toolchain/
        tar -czf dist/sotlas-toolchain-nightly.tar.gz -C dist sotlas-toolchain

    - name: Upload Toolchain Snapshot Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sotlas-toolchain-nightly
        path: dist/sotlas-toolchain-nightly.tar.gz
