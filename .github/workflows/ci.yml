name: Sotlas CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Run Sotlas test suite
      run: |
        python -m unittest discover -s tests -p "test_*.py"

    - name: Verify CLI tools
      run: |
        sotlas version
        sotlas check examples/01_hello_systems/main.sotlas
        sotlas check examples/02_safe_structures/main.sotlas
        sotlas check examples/03_systems_and_intrinsics/main.sotlas
        sotlas check examples/04_raw_memory_and_unsafe/main.sotlas
        sotlas dump-ast examples/01_hello_systems/main.sotlas
        sotlas dump-sir examples/01_hello_systems/main.sotlas
